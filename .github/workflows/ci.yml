name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/open-source
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check documentation links and anchors
        uses: lycheeverse/lychee-action@885c65f3dc543b57c898c8099f4e08c8afd178a2 # v2.6.1
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          lycheeVersion: v0.24.2
          fail: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: python -m pip install "detect-secrets==1.5.0" "pre-commit==4.6.1" "ruff==0.16.0"

      - name: Scan tracked files for secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --no-verify --cores 2

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  unit:
    name: Unit (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python: "3.10"
            numpy: "1.26.4"
            torch: "2.10.0"
          - name: primary
            python: "3.12"
            numpy: "2.5.1"
            torch: "2.13.0"

    env:
      CUDA_VISIBLE_DEVICES: ""
      NUMPY_VERSION: ${{ matrix.numpy }}
      TORCH_VERSION: ${{ matrix.torch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install supported runtime
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --only-binary=:all: \
            "torch==$TORCH_VERSION"
          python -m pip install "numpy==$NUMPY_VERSION" "setuptools>=83" pytest pytest-timeout
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run CPU unit suite
        run: python -m pytest -q

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install "build>=1.2,<2" "pip-audit==2.9.0" "twine>=6,<7"
          python -m build
          python -m twine check dist/*

      - name: Test isolated wheel import
        run: |
          smoke_env="$RUNNER_TEMP/lm-resiliency-wheel-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --only-binary=:all: \
            "torch==2.13.0"
          "$smoke_env/bin/python" -m pip install "numpy==2.5.1" "setuptools>=83"
          "$smoke_env/bin/python" -m pip install --no-deps dist/*.whl
          "$smoke_env/bin/python" -m pip check
          "$smoke_env/bin/lm-resiliency-discover-moe-regimes" --help
          cd "$RUNNER_TEMP"
          "$smoke_env/bin/python" -c \
            'import lm_resiliency, sys; optional = {"deepspeed", "megatron", "torchtitan", "triton"}; assert not optional.intersection(sys.modules); print(lm_resiliency.__file__)'

      - name: Audit runtime dependencies
        run: |
          smoke_env="$RUNNER_TEMP/lm-resiliency-wheel-smoke"
          runtime_requirements="$RUNNER_TEMP/lm-resiliency-runtime-requirements.txt"
          "$smoke_env/bin/python" -m pip freeze |
            sed -E -e '/^lm-resiliency/d' -e 's/^(torch==[^+]+)\+cpu$/\1/' \
              > "$runtime_requirements"
          python -m pip_audit \
            --requirement "$runtime_requirements" \
            --no-deps \
            --disable-pip \
            --strict \
            --progress-spinner off \
            --desc off

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
