name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/open-source
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation links and anchors
        env:
          LYCHEE_VERSION: "0.24.2"
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          release_url="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$release_url/$archive"
          curl -fsSL -o "$RUNNER_TEMP/$archive.sha256" "$release_url/$archive.sha256"
          (
            cd "$RUNNER_TEMP"
            sha256sum --check "$archive.sha256"
            tar -xzf "$archive"
          )
          "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" \
            --offline \
            --include-fragments \
            --no-progress \
            './**/*.md'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: python -m pip install -c requirements/tool-versions.txt detect-secrets mypy pre-commit ruff

      - name: Scan tracked files for secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --no-verify --cores 2

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run static type checks
        run: |
          mypy \
            lm_resiliency/__init__.py \
            lm_resiliency/manager_api.py \
            lm_resiliency/orchestration.py \
            lm_resiliency/recovery.py \
            tests/typing/public_api.py

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  unit:
    name: Unit (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python: "3.10"
            numpy: "1.26.4"
            torch: "2.10.0"
          - name: python-3.11-torch-2.11
            python: "3.11"
            numpy: "1.26.4"
            torch: "2.11.0"
          - name: torch-2.12
            python: "3.12"
            numpy: "2.5.1"
            torch: "2.12.0"
          - name: primary
            python: "3.12"
            numpy: "2.5.1"
            torch: "2.13.0"

    env:
      CUDA_VISIBLE_DEVICES: ""
      NUMPY_VERSION: ${{ matrix.numpy }}
      TORCH_VERSION: ${{ matrix.torch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install supported runtime
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --only-binary=:all: \
            "torch==$TORCH_VERSION"
          python -m pip install -c requirements/tool-versions.txt \
            "numpy==$NUMPY_VERSION" pytest pytest-timeout
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run CPU unit suite
        id: cpu_tests
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/unit-results.xml"

      - name: Create revision-bound CPU evidence
        if: ${{ always() && matrix.name == 'primary' }}
        env:
          TEST_OUTCOME: ${{ steps.cpu_tests.outcome }}
        run: |
          python scripts/validation_evidence.py create-pytest \
            --bundle "$RUNNER_TEMP/cpu-primary-evidence" \
            --junit "$RUNNER_TEMP/unit-results.xml" \
            --action-status "$TEST_OUTCOME" \
            --recorded-command 'python -m pytest -q --junitxml="$RUNNER_TEMP/unit-results.xml"' \
            --configuration "python=${{ matrix.python }}" \
            --configuration "numpy=${{ matrix.numpy }}" \
            --configuration "torch=${{ matrix.torch }}" \
            --campaign-id cpu-unit-primary \
            --tier cpu \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --artifact-name "cpu-primary-$GITHUB_SHA" \
            --artifact-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --framework pytorch \
            --framework gemini \
            --framework scout \
            --boundary "CPU tests do not qualify CUDA, NCCL, or multi-process behavior."
          python scripts/validation_evidence.py verify \
            --bundle "$RUNNER_TEMP/cpu-primary-evidence" \
            --expected-commit "$GITHUB_SHA"

      - name: Upload revision-bound CPU evidence
        if: ${{ always() && matrix.name == 'primary' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-primary-${{ github.sha }}
          path: ${{ runner.temp }}/cpu-primary-evidence
          if-no-files-found: error
          retention-days: 90

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install -c requirements/tool-versions.txt build pip-audit twine
          python -m build
          python -m twine check dist/*

      - name: Test isolated wheel import
        run: |
          smoke_env="$RUNNER_TEMP/lm-resiliency-wheel-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --only-binary=:all: \
            "torch==2.13.0"
          "$smoke_env/bin/python" -m pip install "numpy==2.5.1" "setuptools>=83"
          "$smoke_env/bin/python" -m pip install --no-deps dist/*.whl
          "$smoke_env/bin/python" -m pip check
          "$smoke_env/bin/lm-resiliency-discover-moe-regimes" --help
          CUDA_VISIBLE_DEVICES="" "$smoke_env/bin/lm-resiliency-quickstart" \
            --steps 2 \
            --interval 1 \
            --checkpoint-dir "$RUNNER_TEMP/lm-resiliency-wheel-quickstart"
          cd "$RUNNER_TEMP"
          "$smoke_env/bin/python" -c \
            'import lm_resiliency, pathlib, sys; optional = {"deepspeed", "megatron", "torchtitan", "triton"}; assert not optional.intersection(sys.modules); assert pathlib.Path(lm_resiliency.__file__).with_name("py.typed").is_file(); print(lm_resiliency.__file__)'

      - name: Test installed wheel typing as a downstream consumer
        run: |
          smoke_env="$RUNNER_TEMP/lm-resiliency-wheel-smoke"
          consumer="$RUNNER_TEMP/lm-resiliency-consumer.py"
          "$smoke_env/bin/python" -m pip install \
            -c requirements/tool-versions.txt mypy typing-extensions
          cp tests/typing/public_api.py "$consumer"
          cd "$RUNNER_TEMP"
          "$smoke_env/bin/python" -m mypy \
            --config-file "$GITHUB_WORKSPACE/tests/typing/downstream.ini" \
            "$consumer"

      - name: Audit runtime dependencies
        run: |
          smoke_env="$RUNNER_TEMP/lm-resiliency-wheel-smoke"
          runtime_requirements="$RUNNER_TEMP/lm-resiliency-runtime-requirements.txt"
          "$smoke_env/bin/python" -m pip freeze |
            sed -E -e '/^lm-resiliency/d' -e 's/^(torch==[^+]+)\+cpu$/\1/' \
              > "$runtime_requirements"
          python -m pip_audit \
            --requirement "$runtime_requirements" \
            --no-deps \
            --disable-pip \
            --strict \
            --progress-spinner off \
            --desc off

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  required:
    name: CI Required
    if: always()
    needs:
      - quality
      - unit
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify required CI
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          printf 'quality=%s\nunit=%s\npackage=%s\n' \
            "$QUALITY_RESULT" "$UNIT_RESULT" "$PACKAGE_RESULT"
          test "$QUALITY_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
