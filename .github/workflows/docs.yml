name: Documentation

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish versioned docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: python -m pip install -r requirements/docs.txt

      - name: Configure publisher identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish documentation version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mike deploy --push dev
            exit 0
          fi

          if [[ "$EVENT_NAME" != "release" || "$RELEASE_TAG" != v* ]]; then
            echo "Unsupported documentation event: $EVENT_NAME / $RELEASE_TAG" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            mike deploy --push "$version"
            exit 0
          fi

          latest_tag=$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              grep -E '^v[0-9]+([.][0-9]+){1,2}([.-].*)?$' |
              sort -V |
              tail -n 1
          )
          test -n "$latest_tag"

          if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
            mike deploy --push --update-aliases "$version" latest
            mike set-default --push latest
          else
            mike deploy --push "$version"
          fi
