name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build development docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: python -m pip install -r requirements/docs.txt

      - name: Build static documentation
        run: mkdocs build --strict

      - name: Reject symbolic links in generated site
        shell: bash
        run: |
          if find site -type l -print -quit | grep -q .; then
            echo "Generated documentation must not contain symbolic links" >&2
            exit 1
          fi

      - name: Upload static documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-site
          path: site
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish development docs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out trusted publishing base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Download static documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-site
          path: ${{ runner.temp }}/documentation-site

      - name: Publish development documentation tree
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_DIR: ${{ runner.temp }}/documentation-site
        shell: bash
        run: |
          set -euo pipefail

          if find "$SITE_DIR" -type l -print -quit | grep -q .; then
            echo "Downloaded documentation artifact contains a symbolic link" >&2
            exit 1
          fi

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
            git rm -rf .
          fi

          rm -rf dev
          mkdir -p dev
          cp -a "$SITE_DIR"/. dev/
          touch .nojekyll

          if [[ ! -f index.html ]]; then
            cat > index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=dev/">
          <link rel="canonical" href="dev/">
          <title>LM Resiliency documentation</title>
          <p>Redirecting to <a href="dev/">development documentation</a>.</p>
          EOF
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Development documentation is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish documentation dev"
          git push origin gh-pages
