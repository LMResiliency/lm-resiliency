name: Documentation

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: python -m pip install -r requirements/docs.txt

      - name: Build static documentation
        run: mkdocs build --strict

      - name: Reject symbolic links in generated site
        shell: bash
        run: |
          if find site -type l -print -quit | grep -q .; then
            echo "Generated documentation must not contain symbolic links" >&2
            exit 1
          fi

      - name: Upload static documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-site
          path: site
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish versioned docs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out trusted publishing logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Download static documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-site
          path: ${{ runner.temp }}/documentation-site

      - name: Publish documentation tree
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SITE_DIR: ${{ runner.temp }}/documentation-site
        shell: bash
        run: |
          set -euo pipefail

          if find "$SITE_DIR" -type l -print -quit | grep -q .; then
            echo "Downloaded documentation artifact contains a symbolic link" >&2
            exit 1
          fi

          publish_name=dev
          publish_kind=dev
          release_tag=""
          prerelease=false

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            mapfile -t matching_releases < <(
              while IFS=$'\t' read -r tag is_prerelease; do
                commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')
                if [[ "$commit" == "$RELEASE_HEAD_SHA" ]]; then
                  printf '%s\t%s\n' "$tag" "$is_prerelease"
                fi
              done < <(
                gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                  --jq '.[] | select(.draft == false) | [.tag_name, .prerelease] | @tsv'
              )
            )
            if [[ "${#matching_releases[@]}" -ne 1 ]]; then
              echo "Expected exactly one published release at $RELEASE_HEAD_SHA" >&2
              exit 1
            fi
            IFS=$'\t' read -r release_tag prerelease <<<"${matching_releases[0]}"
            [[ "$release_tag" == v* ]] || {
              echo "Release tag must begin with v: $release_tag" >&2
              exit 1
            }
            publish_name="${release_tag#v}"
            publish_kind=release
          fi

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
            git rm -rf .
          fi

          rm -rf -- "$publish_name"
          mkdir -p -- "$publish_name"
          cp -a "$SITE_DIR"/. "$publish_name"/
          touch .nojekyll

          write_redirect() {
            target=$1
            cat > index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=$target/">
          <link rel="canonical" href="$target/">
          <title>LM Resiliency documentation</title>
          <p>Redirecting to <a href="$target/">$target documentation</a>.</p>
          EOF
          }

          if [[ "$publish_kind" == "dev" ]]; then
            if [[ ! -f index.html ]]; then
              write_redirect dev
            fi
          elif [[ "$prerelease" == "false" ]]; then
            latest_tag=$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
                grep -E '^v[0-9]+([.][0-9]+){1,2}([.-].*)?$' |
                sort -V |
                tail -n 1
            )
            test -n "$latest_tag"
            if [[ "$release_tag" == "$latest_tag" ]]; then
              rm -rf latest
              mkdir -p latest
              cp -a "$SITE_DIR"/. latest/
              write_redirect latest
            fi
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Documentation tree is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish documentation ${publish_name}"
          git push origin gh-pages
