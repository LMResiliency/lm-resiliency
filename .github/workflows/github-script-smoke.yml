name: GitHub Script Smoke

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Run GitHub Script
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            core.info('GITHUB_SCRIPT_OK');
